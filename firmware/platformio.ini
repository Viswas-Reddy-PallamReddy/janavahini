; Pushkaralu prototype firmware: one codebase, three roles.
;   pio run -e gateway  -t upload    Board 1: QS node + USB bridge to the backend
;   pio run -e guardian -t upload    Board 2: QS node + guardian for the paired child tag
;   pio run -e tag      -t upload    Board 3: child tag (rotating-ID BLE beacon)

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; Wi-Fi (ESP-NOW) + Bluetooth stack needs > 1.2 MB

[env:gateway]
build_flags = -DROLE_NODE -DNODE_ID=4 -DIS_GATEWAY

[env:guardian]
build_flags = -DROLE_NODE -DNODE_ID=2 -DIS_GUARDIAN

[env:tag]
build_flags = -DROLE_TAG
